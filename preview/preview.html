<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emulator - preview</title>
<link rel="stylesheet" href="../overlay.css">
<style>html,body{margin:0;height:100%;background:#000}</style>
</head>
<body>
<script>
  // Dev harness: run the real overlay against the sample page, no extension needed.
  // ?d=<id> picks the frame, ?o=land rotates, ?src=<url> frames any page instead of the sample.
  window.__DF_SRC = new URLSearchParams(location.search).get("src") || "sample.html";
  window.__DF_FRAMES = "../frames/"; // served from repo root at /frames/
</script>
<script src="../overlay.js"></script>
<script>
  (function () {
    var d = new URLSearchParams(location.search).get("d");
    var land = new URLSearchParams(location.search).get("o") === "land";
    if (!d) return;
    if (window.__emulator) window.__emulator.setDevice(d);
    if (land) {
      var rot = document.querySelector("#emulator-root .df-btn");
      if (rot && !rot.disabled) rot.click();
    }
  })();
</script>
</body>
</html>
